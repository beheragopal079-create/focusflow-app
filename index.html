<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>FOCUSFLOW — Plan smarter. Focus deeper. Achieve more.</title>
    <meta name="description" content="Plan smarter. Focus deeper. Achieve more. A modern study planner with task management, Pomodoro focus timer, and study analytics." />
    <meta property="og:title" content="FOCUSFLOW — Study Planner & Focus Workspace" />
    <meta property="og:description" content="Plan smarter. Focus deeper. Achieve more. Organize studies, manage tasks, track progress, and stay focused." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('focusflow_state_v1');
          if (raw) {
            var parsed = JSON.parse(raw);
            var theme = parsed && parsed.preferences && parsed.preferences.theme;
            if (theme === 'light') {
              document.documentElement.classList.remove('dark');
            } else {
              document.documentElement.classList.add('dark');
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#070D1B] dark:text-slate-100 antialiased selection:bg-violet-500/25 selection:text-violet-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
